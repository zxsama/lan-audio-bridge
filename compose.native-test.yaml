# Isolated native-backend regression environment; never merge with compose.yaml.
name: lan-audio-bridge-native-test
services:
  audio:
    image: lan-audio-bridge:native-development
    pull_policy: never
    init: true
    restart: 'no'
    stop_grace_period: 20s
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, NET_BIND_SERVICE, KILL]
    security_opt: [no-new-privileges:true]
    environment:
      DEVICE_NAME: LAB Native Test
      AUDIO_MODE: 'null'
      SAMPLE_RATE: '48000'
      OUTPUT_VOLUME: '100'
      ENABLE_AIRPLAY: 'true'
      ENABLE_DLNA: 'true'
      ENABLE_SPOTIFY: 'true'
      ENABLE_MIPLAY: 'true'
      ENABLE_DESKTOP: 'true'
      VBAN_SOURCE_IP: '127.0.0.1'
      VBAN_STREAM_NAME: 'Windows'
      DESKTOP_BACKEND: native
      DESKTOP_NATIVE_LATENCY_MS: '16'
      DESKTOP_NATIVE_JITTER_MS: '8'
      DESKTOP_IDLE_MS: '500'
      DLNA_BUFFER_MS: '1000'
      OUTPUT_BUFFER_MS: '200'
      NETWORK_INTERFACE: eth0
    volumes:
      - native-test-data:/data
      - ./:/workspace:ro
    tmpfs:
      - /run:size=64m,mode=755
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: [CMD, python3, /app/healthcheck.py]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
volumes:
  native-test-data:
