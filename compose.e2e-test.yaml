# Windows sender -> WSL native receiver latency test; never merge with compose.yaml.
# Host networking inside WSL keeps the Windows source address (WSL NAT gateway).
name: lan-audio-bridge-e2e-test
services:
  audio:
    image: lan-audio-bridge:native-development
    pull_policy: never
    network_mode: host
    init: true
    restart: 'no'
    stop_grace_period: 20s
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, NET_BIND_SERVICE, KILL]
    security_opt: [no-new-privileges:true]
    # Lets PULSE_REALTIME raise PulseAudio threads without CAP_SYS_NICE.
    ulimits:
      rtprio: 9
      nice: 31
    environment:
      DEVICE_NAME: LAB E2E Test
      AUDIO_MODE: 'null'
      SAMPLE_RATE: '48000'
      OUTPUT_VOLUME: '100'
      ENABLE_AIRPLAY: 'false'
      ENABLE_DLNA: 'false'
      ENABLE_SPOTIFY: 'false'
      ENABLE_MIPLAY: 'false'
      ENABLE_DESKTOP: 'true'
      VBAN_SOURCE_IP: ${E2E_SOURCE_IP:-172.17.48.1}
      VBAN_PORT: '6980'
      VBAN_STREAM_NAME: 'Windows'
      DESKTOP_BACKEND: native
      DESKTOP_NATIVE_LATENCY_MS: ${E2E_LATENCY_MS:-16}
      DESKTOP_NATIVE_JITTER_MS: ${E2E_JITTER_MS:-8}
      DESKTOP_IDLE_MS: '500'
      PULSE_REALTIME: ${E2E_PULSE_REALTIME:-false}
    volumes:
      - e2e-test-data:/data
      - ./:/workspace:ro
      - ./app:/app:ro  # test the working tree's runtime without rebuilding the image
    tmpfs:
      - /run:size=64m,mode=755
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: [CMD, python3, /app/healthcheck.py]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 45s
volumes:
  e2e-test-data:
