name: lan-audio-bridge
services:
  audio:
    image: lan-audio-bridge:0.5.0
    pull_policy: never
    network_mode: host
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    devices:
      - /dev/snd:/dev/snd
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, NET_BIND_SERVICE, KILL]
    security_opt:
      - no-new-privileges:true
    # Used only with PULSE_REALTIME=true; grants no capability.
    ulimits:
      rtprio: 9
      nice: 31
    environment:
      DEVICE_NAME: ${DEVICE_NAME:-NAS Audio}
      AUDIO_MODE: alsa
      AUDIO_DEVICE: ${AUDIO_DEVICE:?Set a stable ALSA device name in .env}
      SAMPLE_RATE: ${SAMPLE_RATE:-48000}
      OUTPUT_VOLUME: ${OUTPUT_VOLUME:-100}
      ENABLE_AIRPLAY: ${ENABLE_AIRPLAY:-true}
      ENABLE_DLNA: ${ENABLE_DLNA:-true}
      ENABLE_SPOTIFY: ${ENABLE_SPOTIFY:-true}
      ENABLE_MIPLAY: ${ENABLE_MIPLAY:-true}
      ENABLE_DESKTOP: ${ENABLE_DESKTOP:-false}
      VBAN_SOURCE_IP: ${VBAN_SOURCE_IP:-}
      VBAN_PORT: ${VBAN_PORT:-6980}
      VBAN_STREAM_NAME: ${VBAN_STREAM_NAME:-Windows}
      DESKTOP_BUFFER_MS: ${DESKTOP_BUFFER_MS:-50}
      DESKTOP_PLAYER_MS: ${DESKTOP_PLAYER_MS:-30}
      DESKTOP_JITTER_MS: ${DESKTOP_JITTER_MS:-20}
      DESKTOP_BACKEND: ${DESKTOP_BACKEND:-python}
      DESKTOP_NATIVE_LATENCY_MS: ${DESKTOP_NATIVE_LATENCY_MS:-16}
      DESKTOP_NATIVE_JITTER_MS: ${DESKTOP_NATIVE_JITTER_MS:-8}
      DESKTOP_VOLUME: ${DESKTOP_VOLUME:-100}
      DESKTOP_IDLE_MS: ${DESKTOP_IDLE_MS:-500}
      DLNA_BUFFER_MS: ${DLNA_BUFFER_MS:-1000}
      OUTPUT_BUFFER_MS: ${OUTPUT_BUFFER_MS:-200}
      OUTPUT_SCHEDULING: ${OUTPUT_SCHEDULING:-timer}
      OUTPUT_FRAGMENT_MS: ${OUTPUT_FRAGMENT_MS:-2}
      OUTPUT_FRAGMENTS: ${OUTPUT_FRAGMENTS:-3}
      PULSE_REALTIME: ${PULSE_REALTIME:-false}
      OUTPUT_IDLE_SUSPEND_MS: ${OUTPUT_IDLE_SUSPEND_MS:-0}
      NETWORK_INTERFACE: ${NETWORK_INTERFACE:-}
      DLNA_PORT: ${DLNA_PORT:-49494}
      AIRPLAY_PORT: ${AIRPLAY_PORT:-7000}
      SPOTIFY_PORT: ${SPOTIFY_PORT:-24879}
      MIPLAY_PORT: ${MIPLAY_PORT:-8899}
    volumes:
      - type: bind
        source: ${DATA_DIR:?Set an existing dedicated absolute host directory in .env}
        target: /data
        bind:
          create_host_path: false
    tmpfs:
      - /run:size=64m,mode=755
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: [CMD, python3, /app/healthcheck.py]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
